bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    use_feedback: true
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    odom_topic: /odometry/filtered

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.0274533

    # Controller plugin (Regulated Pure Pursuit)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Velocity and Acceleration Limits
      desired_linear_vel: 0.8
      min_approach_linear_velocity: 0.05
      max_angular_vel: 0.8  # Allow sufficient angular velocity for tight turns
      max_angular_accel: 3.3

      # Lookahead Distance Configuration
      lookahead_dist: 0.8  # Adjust to balance between responsiveness and smoothness
      min_lookahead_dist: 0.5  # Large enough for the robot to navigate tight turns smoothly
      max_lookahead_dist: 1.5
      lookahead_time: 1.0   # Dynamic lookahead adjustment based on speed
      use_velocity_scaled_lookahead_dist: false

      # Rotate to Heading Configuration (Rotate in place before tracking path)
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.785398
      rotate_to_heading_min_angle: 0.785398    # Rotate in place if heading error >= 45 degrees

      # Velocity Scaling and Safety Features
      use_cost_regulated_linear_velocity_scaling: true  # Auto-slowdown on sharp curves
      use_regulated_linear_velocity_scaling: true  # Auto-slowdown near obstacles
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      approach_velocity_scaling_dist: 1.0
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.75

      # General & Collision Settings
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.2
      use_collision_detection: true
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.1675,0.215], [-0.318,0.215], [-0.318,-0.215], [0.1675,-0.215]]"

      # Active Costmap Layers
      plugins: ["obstacle_layer",  "inflation_layer"]
      
      # Inflation Layer Settings
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.58      # Distance to inflate costs around obstacles
        cost_scaling_factor: 1.75   # Exponential decay factor for inflation cost
      
      # Obstacle Layer Settings
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: points virtual_obstacle_source
        
        # 2D LiDAR Source (/points2)
        points:
          topic: /points2
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          clearing: True
          marking: True

        # Virtual Wall Source
        virtual_obstacle_source:
          topic: /Local_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Frame & Update Rates
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 0.5

      # Map Dimensions & Footprint
      resolution: 0.05
      width: 15   # Overridden dynamically by static map dimensions
      height: 15  # Overridden dynamically by static map dimensions
      footprint: "[[0.1675,0.215], [-0.318,0.215], [-0.318,-0.215], [0.1675,-0.215]]"
      track_unknown_space: true
      always_send_full_costmap: True

      # Active Costmap Layers
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # 1. Static Map Layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # 2. Obstacle Layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: virtual_obstacle_source points2
        # 2D LiDAR Source (/poinst2)
        points:
          topic: /points2
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          clearing: True
          marking: True

        # Global Virtual Wall Source
        virtual_obstacle_source:
          topic: /Global_virtual_wall
          data_type: PointCloud2
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 100.0
          raytrace_max_range: 101.0

      # Inflation Layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7   # Kept moderate for optimal global path planning

map_server:
  ros__parameters:
    yaml_filename: ""

planner_server:
  ros__parameters:
    # Expected re-planning frequency (Hz)
    expected_planner_frequency: 15.0
    costmap_update_timeout: 1.0

    # Active Planner Plugins
    planner_plugins: ["GridBased"]

    # Global Planner Configuration (Navfn)
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5        # Goal search tolerance if exact goal is blocked (meters)
      use_astar: false      # Set to true to use A* instead of Dijkstra for faster search
      allow_unknown: true   # Allow paths to be planned through unknown space

smoother_server:
  ros__parameters:
    # Active Smoother Plugins
    smoother_plugins: ["simple_smoother"]

    # Simple Smoother Configuration
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10    #Convergence tolerance
      max_its: 1000         # Maximum optimization iterations
      do_refinement: True   # Perform path refinement post-smoothing for smoother tracking

behavior_server:
  ros__parameters:
    # Costmap & Footprint Topic Names
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    # Execution Frequency & TF Frames
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

    # Active Recovery Behavior Plugins
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    
    # Plugin Declarations
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"

    # Safety & Physical Motion Limits for Recovery
    simulate_ahead_time: 2.0    # Lookahead time in seconds for collision checking
    max_rotational_vel: 1.0     # Max rotation speed during recovery (rad/s)
    min_rotational_vel: 0.1     # Min rotation speed during recovery (rad/s)
    rotational_acc_lim: 3.2     # Rotational acceleration limit (rad/s^2)

waypoint_follower:
  ros__parameters:
    # Execution Loop Rate & Failure Handling
    loop_rate: 20
    stop_on_failure: false   # Set to 'true' if the mission must abort when a waypoint is unreachable
    action_server_result_timeout: 900.0

    # Task Executor Plugin Settings (Task to perform upon reaching each waypoint)
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200  # Pause duration at each waypoint in milliseconds (e.g., 2000ms = 2 seconds)

velocity_smoother:
  ros__parameters:
    # Execution Frequency & Feedback Type
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"  # Options: "OPEN_LOOP", "CLOSED_LOOP", "DISABLED"

    # Odometry Topic (Used when feedback is set to CLOSED_LOOP)
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1

    # Velocity Limits [x, y, theta]
    max_velocity: [2.0, 0.0, 2.0]
    min_velocity: [-2.0, 0.0, -2.0]

    # Acceleration & Deceleration Limits [x, y, theta]
    max_accel: [0.3, 0.0, 3.3]
    max_decel: [-0.3, 0.0, -3.3]

    # Deadband & Timeout
    deadband_velocity: [0.0, 0.0, 0.0]  # Minimum velocity threshold to output zero velocity
    velocity_timeout: 1.0               # Stop outputting velocity if no command is received for N seconds
    scale_velocities: False             # Set to 'true' to scale both linear & angular velocities proportionally

collision_monitor:
  ros__parameters:
    # Coordinate Frames
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    # Topic Pipeline: [Smoother Output] -> cmd_vel_in -> (Collision Monitor) -> cmd_vel_out -> [Motor Driver]
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav2"
    state_topic: "collision_monitor_state"

    # Timeouts and Corrections
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0

    # Active Polygons List (Order matters: Stop evaluated first, then Slowdown)
    polygons: ["VelocityPolygonSlowdown"]

    # [Polygon] Slowdown Warning Zone (Outer Footprint)
    VelocityPolygonSlowdown:
      type: "velocity_polygon"
      action_type: "slowdown"
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_slow"
      velocity_polygons: ["slow_forward_high", "slow_forward_low", "slow_backward", "slow_idle"]
      holonomic: false

      slow_forward_high:
        points: "[[1.1675, 0.315], [1.1675, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.7
        linear_max: 1.5
        theta_min: -1.5
        theta_max: 1.5
      slow_forward_low:
        points: "[[0.5, 0.315], [0.5, -0.315], [-0.32, -0.315], [-0.32, 0.315]]"
        linear_min: 0.3
        linear_max: 0.699
        theta_min: -1.5
        theta_max: 1.5
      slow_backward:
        points: "[[0.2, 0.315], [0.2, -0.315], [-0.6, -0.315], [-0.6, 0.315]]"
        linear_min: -1.0
        linear_max: -0.05
        theta_min: -1.5
        theta_max: 1.5
      slow_idle:
        points: "[[0.2, 0.25], [0.2, -0.25], [-0.35, -0.25], [-0.35,  0.25]]"
        linear_min: 0.0
        linear_max: 0.0
        theta_min: -1.5
        theta_max: 1.5

    # Active Sensor Observation Sources
    observation_sources: ["points"]
    points:
      type: "pointcloud" #PointCloud2
      topic: /points2
      min_height: 0.0
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    # Server Core Configuration
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3

    # Frames & Topics
    base_frame: "base_link"
    fixed_frame: "odom"
    odom_topic: "/odometry/filtered"
    odom_duration: 0.3

    dock_prestaging_tolerance: 0.5
    introspection_mode: "disabled"
    dock_backwards: false

    # Dock Plugins Configuration
    dock_plugins: ['nova_carter_dock']

    nova_carter_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7

      # Direction & Batter Status
      dock_direction: "forward" # "backward"
      use_battery_status: false # true
      use_stall_detection: false
      rotate_to_dock: false

      # External Detection (AprilTag / Vision Detector)
      use_external_detection_pose: true
      detector_service_name: '/detector/toggle'
      detector_service_timeout: 5.0
      external_detection_timeout: 1.0
      subscribe_toggle: true

      # Camera Tag -> Dock Charging Port TF Calibration Offsets
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock Instances
    docks: ['home_dock']
    home_dock:
      type: 'nova_carter_dock'
      frame: map
      pose: [0.0, 0.0, 0.0]
      id: '0'

    # Docking Controller
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      v_angular_max: 0.15
      slowdown_radius: 0.45

      rotate_to_heading_angular_vel: 0.1
      rotate_to_heading_max_angular_accel: 0.2

      # Collision Avoidance during Docking
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3

route_server:
  ros__parameters:
    # Core Frame & Path Generation
    base_frame: "base_footprint"                  # Robot's base frame
    route_frame: "map"                            # Global map frame
    path_density: 0.05                            # Point spacing for dense path generation (m)
    max_iterations: 0                             # Max search iterations (0: unlimited)
    max_planning_time: 2.0                        # Max path planning timeout (s)

    # Corner Smoothing
    smooth_corners: true                          # Enable smoothing for sharp graph corners
    smoothing_radius: 1.0                         # Radius applied to corner smoothing (m)
    smoothing_angle_threshold: 2.9                # Angle threshold to apply smoothing (rad)
    
    # Costmap Settings
    costmap_topic: 'global_costmap/costmap_raw'   # Costmap for collision checking and NN search

    # Graph Loader & Plugins Configuration
    graph_file_loader: "GeoJsonGraphFileLoader"
    plugin: “nav2_route::GeoJsonGraphFileLoader”
    # graph_filepath: "/home/tetra/Downloads/test.geojson"                            # file path to graph to use

    # Edge Cost Evaluators
    edge_cost_functions: ["DistanceScorer", "DynamicEdgesScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    DynamicEdgesScorer:
      plugin: "nav2_route::DynamicEdgesScorer"

    # Route Opertaions
    operations: ["AdjustSpeedLimit", "ReroutingService"]
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    ReroutingService:
      plugin: "nav2_route::ReroutingService"

    # Path Tracking & Pruning Settings
    tracker_update_rate: 50.0                     # Status check rate for path tracking (Hz)
    aggregate_blocked_ids: false                  # Accumulate blocked edge IDs over request lifespan

    # Distance Tolerances for Node Achievement
    boundary_radius_to_achieve_node: 1.0          # Goal acceptance radius for boundary nodes (m)
    radius_to_achieve_node: 2.0                   # Goal acceptance radius for internal nodes (m)

    # Pruning Parameters
    max_prune_dist_from_edge: 8.0                 # Distance threshold to stop edge pruning (m)
    min_prune_dist_from_start: 0.10               # Min distance from start to prune start node (m)
    min_prune_dist_from_goal: 0.15                # Min distance from goal to prune goal node (m)
    prune_goal: true                              # Allow pruning goal nodes when goal is passed

    # Nearest Neighbor (NN) Graph Search
    enable_nn_search: true                        # Use costmap-based BFS to find closest graph node
    max_nn_search_iterations: 10000               # Max iterations for BFS search
    num_nearest_nodes: 5                          # Number of nearest neighbors evaluated in BFS
